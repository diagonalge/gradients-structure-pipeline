[project]
name = "ds-structure-server"
version = "0.1.0"
description = "Gradients ds-structure generation worker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0",
  "requests>=2.31.0",
  "loguru>=0.7.0",
  "minio>=7.2.0",
  "datasets>=2.19.0",
  "beautifulsoup4>=4.12.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
ocr = ["pdf2image>=1.17.0", "pytesseract>=0.3.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ds-structure-server = "ds_structure_server.main:app"
